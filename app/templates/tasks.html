{% extends "base.html" %}

{% block title %}Tasks{% endblock %}

{% block content %}
<div class="d-flex justify-between align-center mb-2">
    <h2>My Tasks</h2>
    <button class="btn btn-primary" onclick="openTaskModal()">Create New Task</button>
</div>

<div class="filters-bar mb-3">
    <input type="text" id="searchTask" class="form-control" placeholder="Search tasks..." style="max-width: 200px;">
    
    <select id="filterStatus" class="form-control" style="max-width: 150px;">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
    </select>
    
    <select id="filterPriority" class="form-control" style="max-width: 150px;">
        <option value="">All Priorities</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
    </select>
    
    <select id="sortBy" class="form-control" style="max-width: 150px;">
        <option value="created_at">Date Created</option>
        <option value="due_date">Due Date</option>
        <option value="priority">Priority</option>
    </select>
    
    <button class="btn btn-primary" onclick="loadTasks()">Apply Filters</button>
</div>

<div class="card" style="overflow-x: auto;">
    <table class="task-table" id="tasksTable">
        <thead>
            <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Due Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tasksBody">
            <!-- Tasks will be loaded here -->
        </tbody>
    </table>
    <div id="emptyState" class="text-center mt-3 hidden">
        <p class="mb-2">No tasks found matching your criteria.</p>
    </div>
</div>

<!-- Task Modal -->
<div id="taskModal" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Create Task</h3>
            <button class="close-modal" onclick="closeTaskModal()">&times;</button>
        </div>
        <form id="taskForm">
            <input type="hidden" id="taskId">
            <div class="form-group">
                <label for="taskTitle">Title *</label>
                <input type="text" id="taskTitle" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="taskDesc">Description</label>
                <textarea id="taskDesc" class="form-control" rows="3"></textarea>
            </div>
            <div class="d-flex" style="gap:1rem">
                <div class="form-group" style="flex:1">
                    <label for="taskCategory">Category</label>
                    <input type="text" id="taskCategory" class="form-control">
                </div>
                <div class="form-group" style="flex:1">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority" class="form-control">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
            </div>
            <div class="d-flex" style="gap:1rem">
                <div class="form-group" style="flex:1">
                    <label for="taskStatus">Status</label>
                    <select id="taskStatus" class="form-control">
                        <option value="Pending" selected>Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1">
                    <label for="taskDueDate">Due Date</label>
                    <input type="date" id="taskDueDate" class="form-control">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Save Task</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', loadTasks);

async function loadTasks() {
    const search = document.getElementById('searchTask').value;
    const status = document.getElementById('filterStatus').value;
    const priority = document.getElementById('filterPriority').value;
    const sortBy = document.getElementById('sortBy').value;
    
    let query = new URLSearchParams();
    if (search) query.append('search', search);
    if (status) query.append('status', status);
    if (priority) query.append('priority', priority);
    if (sortBy) query.append('sort_by', sortBy);
    
    try {
        const res = await API.tasks.getAll(query.toString());
        renderTasks(res.tasks);
    } catch (err) {
        showAlert('Failed to load tasks');
    }
}

function renderTasks(tasks) {
    const tbody = document.getElementById('tasksBody');
    const table = document.getElementById('tasksTable');
    const empty = document.getElementById('emptyState');
    
    tbody.innerHTML = '';
    
    if (tasks.length === 0) {
        table.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
    }
    
    table.classList.remove('hidden');
    empty.classList.add('hidden');
    
    tasks.forEach(task => {
        const tr = document.createElement('tr');
        
        // Priority and Status badges class
        const prioClass = 'badge-priority-' + task.priority;
        const statusClass = 'badge-status-' + task.status.replace(' ', '.');
        
        tr.innerHTML = `
            <td>
                <strong>${task.title}</strong>
                ${task.description ? `<div style="font-size:0.85em;color:var(--gray)">${task.description.substring(0, 50)}${task.description.length > 50 ? '...' : ''}</div>` : ''}
            </td>
            <td>${task.category || '-'}</td>
            <td><span class="badge ${prioClass}">${task.priority}</span></td>
            <td><span class="badge ${statusClass}">${task.status}</span></td>
            <td>${formatDate(task.due_date)}</td>
            <td>
                <button class="btn btn-sm btn-primary" onclick='editTask(${JSON.stringify(task).replace(/'/g, "&#39;")})'>Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.id})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function openTaskModal() {
    document.getElementById('modalTitle').innerText = 'Create Task';
    document.getElementById('taskForm').reset();
    document.getElementById('taskId').value = '';
    document.getElementById('taskModal').classList.remove('hidden');
}

function closeTaskModal() {
    document.getElementById('taskModal').classList.add('hidden');
}

function editTask(task) {
    document.getElementById('modalTitle').innerText = 'Edit Task';
    document.getElementById('taskId').value = task.id;
    document.getElementById('taskTitle').value = task.title;
    document.getElementById('taskDesc').value = task.description || '';
    document.getElementById('taskCategory').value = task.category || '';
    document.getElementById('taskPriority').value = task.priority;
    document.getElementById('taskStatus').value = task.status;
    
    if (task.due_date) {
        // extract YYYY-MM-DD
        document.getElementById('taskDueDate').value = task.due_date.substring(0, 10);
    } else {
        document.getElementById('taskDueDate').value = '';
    }
    
    document.getElementById('taskModal').classList.remove('hidden');
}

document.getElementById('taskForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const id = document.getElementById('taskId').value;
    const payload = {
        title: document.getElementById('taskTitle').value,
        description: document.getElementById('taskDesc').value,
        category: document.getElementById('taskCategory').value,
        priority: document.getElementById('taskPriority').value,
        status: document.getElementById('taskStatus').value,
        due_date: document.getElementById('taskDueDate').value || null
    };
    
    try {
        if (id) {
            await API.tasks.update(id, payload);
            showAlert('Task updated successfully', 'success');
        } else {
            await API.tasks.create(payload);
            showAlert('Task created successfully', 'success');
        }
        closeTaskModal();
        loadTasks();
    } catch (err) {
        showAlert(err.message);
    }
});

async function deleteTask(id) {
    if (confirm('Are you sure you want to delete this task?')) {
        try {
            await API.tasks.delete(id);
            showAlert('Task deleted successfully', 'success');
            loadTasks();
        } catch (err) {
            showAlert('Failed to delete task');
        }
    }
}
</script>
{% endblock %}
